name: smart_nutrition_mobile
description: "Smart Nutrition Platform mobile application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  health: 13.3.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/limely/logolar/
    - assets/limely/maskotlar/
    - assets/limely/ikonlar/koyu/
    - assets/limely/ikonlar/beyaz/
    - assets/limely/dekorlar/
    - assets/limely/lisanslar/
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/limely/fontlar/figtree/figtree.ttf
